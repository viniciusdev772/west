name: CI
on:
  workflow_dispatch:
  push:
    tags:
      - "v*"
  pull_request:

jobs:
  Build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup JDK
        uses: actions/setup-java@v4
        with:
          java-version: 17
          distribution: temurin

      # Recria o Gradle Wrapper completamente
      - name: Setup Gradle Wrapper
        run: |
          # Remove arquivos potencialmente corrompidos
          rm -rf gradle
          rm -f gradlew
          rm -f gradlew.bat

          # Cria novo diretório para o wrapper
          mkdir -p gradle/wrapper

          # Baixa arquivos essenciais do Gradle Wrapper
          wget -O gradle/wrapper/gradle-wrapper.jar https://github.com/gradle/gradle/raw/master/gradle/wrapper/gradle-wrapper.jar
          wget -O gradle/wrapper/gradle-wrapper.properties https://github.com/gradle/gradle/raw/master/gradle/wrapper/gradle-wrapper.properties
          wget -O gradlew https://github.com/gradle/gradle/raw/master/gradlew
          wget -O gradlew.bat https://github.com/gradle/gradle/raw/master/gradlew.bat

          # Torna o script executável
          chmod +x gradlew

      # Executa o Gradle com um comando mais básico
      - name: Build Native Libraries
        run: |
          # Verifica se o Gradle Wrapper está funcionando
          ./gradlew -v

          # Tenta compilar as bibliotecas nativas
          ./gradlew :app:externalNativeBuildDebug

      - name: Collect Native Libraries
        run: |
          mkdir -p native-libs
          find app/build -name "*.so" -type f -exec cp {} native-libs/ \;
          # Lista os arquivos para debug
          echo "Arquivos encontrados:"
          ls -la native-libs/

      - name: Create Release
        id: create_release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v1
        with:
          files: native-libs/*.so
          name: Release ${{ github.ref_name }}
          draft: false
          prerelease: false
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Upload Artifact (for non-release builds)
        if: "!startsWith(github.ref, 'refs/tags/')"
        uses: actions/upload-artifact@v4
        with:
          name: native-libs
          path: native-libs/*.so
