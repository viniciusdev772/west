name: Compile and Release Native Library

on:
  push:
  workflow_dispatch:

jobs:
  build:
    name: Build Native Library
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout code
        uses: actions/checkout@v3
        
      - name: Setup Android NDK
        run: |
          sudo apt-get update
          sudo apt-get install -y ninja-build
          
          # Instalar o Android NDK via cmdline-tools
          mkdir -p ${ANDROID_HOME}/cmdline-tools
          wget https://dl.google.com/android/repository/commandlinetools-linux-8512546_latest.zip
          unzip commandlinetools-linux-8512546_latest.zip -d ${ANDROID_HOME}/cmdline-tools
          mv ${ANDROID_HOME}/cmdline-tools/cmdline-tools ${ANDROID_HOME}/cmdline-tools/latest
          
          # Configurar PATH
          export PATH=${ANDROID_HOME}/cmdline-tools/latest/bin:$PATH
          
          # Instalar NDK
          yes | sdkmanager --licenses
          sdkmanager --install "ndk;25.2.9519653"
          echo "ANDROID_NDK_HOME=${ANDROID_HOME}/ndk/25.2.9519653" >> $GITHUB_ENV
      
      - name: Build native library
        run: |
          cd app/src/main/jni
          
          # Verificar arquivos existentes
          echo "Arquivos na pasta jni:"
          ls -la
          
          # Compilar com ndk-build
          ${ANDROID_NDK_HOME}/ndk-build APP_ABI="armeabi-v7a" V=1
          
          # Verificar se o build foi gerado
          if [ -d "../libs/armeabi-v7a" ]; then
            echo "Arquivos compilados:"
            ls -la ../libs/armeabi-v7a
          else
            echo "Erro: Falha na compilação. Diretório de saída não encontrado."
            exit 1
          fi
          
          # Criar diretório para output
          mkdir -p ../../../build/native-libs
          cp -R ../libs/armeabi-v7a/* ../../../build/native-libs/
      
      - name: Upload native library as artifact
        uses: actions/upload-artifact@v4
        with:
          name: native-libs
          path: app/build/native-libs/
      
      - name: Create Release
        id: create_release
        uses: actions/create-release@v1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          tag_name: release-${{ github.run_number }}
          release_name: Release ${{ github.run_number }}
          body: |
            Compilação automática do commit: ${{ github.sha }}
          draft: false
          prerelease: false
      
      - name: Upload Release Assets
        run: |
          cd app/build/native-libs
          for file in *.so; do
            curl -X POST \
              -H "Authorization: token ${{ secrets.GITHUB_TOKEN }}" \
              -H "Content-Type: application/octet-stream" \
              --data-binary @"$file" \
              "${{ steps.create_release.outputs.upload_url }}?name=$file"
          done
      
      - name: Update latest tag
        run: |
          git config --global user.name "GitHub Actions"
          git config --global user.email "actions@github.com"
          git tag -f latest
          git push -f origin latest
