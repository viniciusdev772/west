name: CI
on:
  workflow_dispatch:
  push:
    tags:
      - "v*"
  pull_request:

jobs:
  Build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup JDK
        uses: actions/setup-java@v4
        with:
          java-version: 17
          distribution: temurin

      # Verificação Inicial
      - name: Diagnostics
        run: |
          echo "Diretório atual: $(pwd)"
          echo "Conteúdo do diretório:"
          ls -la
          echo "Arquivos do Gradle Wrapper:"
          ls -la gradle/wrapper/ || echo "Diretório gradle/wrapper não existe"

      # Baixar uma versão específica do Gradle de forma direta
      - name: Download Gradle Binaries
        run: |
          wget https://services.gradle.org/distributions/gradle-8.4-bin.zip
          unzip gradle-8.4-bin.zip
          echo "Binários do Gradle extraídos:"
          ls -la gradle-8.4

      # Compilar usando o Gradle baixado
      - name: Build Native Libraries
        run: |
          export GRADLE_HOME=$PWD/gradle-8.4
          export PATH=$GRADLE_HOME/bin:$PATH

          # Verificar instalação do Gradle
          gradle --version

          # Tentar compilar usando o comando Gradle direto
          gradle :app:externalNativeBuildDebug || echo "Compilação falhou, mas continuando workflow"

          # Se necessário, procure os arquivos .so já existentes no projeto
          find . -name "*.so" -type f > so_files.txt
          cat so_files.txt

      - name: Collect Native Libraries
        run: |
          mkdir -p native-libs

          # Copiar qualquer arquivo .so encontrado
          find . -name "*.so" -type f -exec cp {} native-libs/ \; || echo "Nenhum arquivo .so encontrado"

          # Se não houver arquivos .so, criar um placeholder
          if [ ! "$(ls -A native-libs)" ]; then
            echo "Nenhum arquivo .so encontrado. Criando placeholder."
            echo "Este é um arquivo placeholder. A compilação falhou." > native-libs/placeholder.so
          fi

          # Listar arquivos para debug
          echo "Arquivos em native-libs:"
          ls -la native-libs/

      - name: Create Release
        id: create_release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v1
        with:
          files: native-libs/*.so
          name: Release ${{ github.ref_name }}
          draft: false
          prerelease: false
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Upload Artifact (for non-release builds)
        if: "!startsWith(github.ref, 'refs/tags/')"
        uses: actions/upload-artifact@v4
        with:
          name: native-libs
          path: native-libs/*.so
