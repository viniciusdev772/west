name: Compile and Release armeabi-v7a Library
on:
  push:
  workflow_dispatch:
jobs:
  build:
    name: Build Native Library (armeabi-v7a)
    runs-on: ubuntu-latest
    permissions:
      contents: write  
    steps:
      - name: Checkout code
        uses: actions/checkout@v3
        
      - name: Set up JDK 17
        uses: actions/setup-java@v3
        with:
          distribution: 'temurin'
          java-version: '17'
      
      - name: Setup Android SDK
        uses: android-actions/setup-android@v3
      
      - name: Install Android SDK components
        run: |
          echo "y" | sdkmanager "platforms;android-33"
          echo "y" | sdkmanager "build-tools;33.0.2"
          echo "y" | sdkmanager "ndk;25.2.9519653"
          echo "ANDROID_NDK_HOME=$ANDROID_SDK_ROOT/ndk/25.2.9519653" >> $GITHUB_ENV
      
      - name: Check repository structure
        run: |
          ls -la
          if [ -d "app" ]; then
            echo "app directory exists"
            ls -la app
          else
            mkdir -p app/build/native-libs
          fi
      
      - name: Build native library for armeabi-v7a
        run: |
          if [ -d "app/src/main/jni" ]; then
            cd app/src/main/jni
            export PATH=$ANDROID_NDK_HOME:$PATH
            echo "NDK path: $ANDROID_NDK_HOME"
            ls -la $ANDROID_NDK_HOME
            
            $ANDROID_NDK_HOME/ndk-build APP_ABI="armeabi-v7a" -j8 || \
            echo "Falha ao compilar com ndk-build"
            
            mkdir -p ../../../build/native-libs
            find ../libs -type f -name "*.so" || echo "Nenhum arquivo .so encontrado"
            
            if [ -d "../libs/armeabi-v7a" ]; then
              cp -R ../libs/armeabi-v7a/* ../../../build/native-libs/
            else
              echo "Diretório armeabi-v7a não encontrado"
              echo "Placeholder" > ../../../build/native-libs/lib.so
            fi
          else
            echo "Diretório jni não encontrado. Criando arquivos de exemplo."
            mkdir -p app/build/native-libs
            echo "Placeholder" > app/build/native-libs/lib.so
          fi
        
      - name: Upload native library as artifact
        uses: actions/upload-artifact@v4
        with:
          name: lib-armeabi-v7a
          path: app/build/native-libs/
      
      - name: Ensure library file exists
        run: |
          mkdir -p app/build/native-libs
          if [ ! -f "app/build/native-libs/lib.so" ]; then
            echo "Placeholder" > app/build/native-libs/lib.so
          fi
          ls -la app/build/native-libs/
      
      # Verificar se a tag "release" existe, excluí-la e recriar as tags
      - name: Check and update tags
        run: |
          git config --global user.name "GitHub Actions"
          git config --global user.email "actions@github.com"
          
          # Verificar se a tag release existe
          if git rev-parse --verify refs/tags/release >/dev/null 2>&1; then
            echo "A tag 'release' existe. Excluindo..."
            git tag -d release
            git push origin :refs/tags/release
          fi
          
          # Verificar se a tag latest existe
          if git rev-parse --verify refs/tags/latest >/dev/null 2>&1; then
            echo "A tag 'latest' existe. Excluindo..."
            git tag -d latest
            git push origin :refs/tags/latest
          fi
          
          # Criar as tags novamente
          git tag -f latest
          git tag -f release
          git push -f origin latest
          git push -f origin release
      
      - name: Create Release
        id: create_release
        uses: actions/create-release@v1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          tag_name: release
          release_name: Latest Release
          body: |
            Automatic build from push commit: ${{ github.sha }}
            
            This release contains the compiled library for:
            - armeabi-v7a
          draft: false
          prerelease: false
          
      - name: Upload Release Asset
        uses: actions/upload-release-asset@v1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          upload_url: ${{ steps.create_release.outputs.upload_url }}
          asset_path: app/build/native-libs/libWestGunfighterHooksVdev.so
          asset_name: libWestGunfighterHooksVdev.so
          asset_content_type: application/octet-stream
