name: Compile and Release armeabi-v7a Library

on:
  push:
  workflow_dispatch:

jobs:
  build:
    name: Build Native Library (armeabi-v7a)
    runs-on: ubuntu-latest
    permissions:
      contents: write
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v3
        
      - name: Set up JDK 17
        uses: actions/setup-java@v3
        with:
          distribution: 'temurin'
          java-version: '17'
      
      - name: Setup Android SDK
        uses: android-actions/setup-android@v3
      
      - name: Install Android SDK components
        run: |
          echo "y" | sdkmanager "platforms;android-33"
          echo "y" | sdkmanager "build-tools;33.0.2"
          echo "y" | sdkmanager "ndk;25.2.9519653"
          echo "ANDROID_NDK_HOME=$ANDROID_SDK_ROOT/ndk/25.2.9519653" >> $GITHUB_ENV
      
      - name: Check repository structure
        run: |
          ls -la
          mkdir -p app/build/native-libs
      
      - name: Build native library for armeabi-v7a
        run: |
          if [ -d "app/src/main/jni" ]; then
            cd app/src/main/jni
            export PATH=$ANDROID_NDK_HOME:$PATH
            echo "NDK path: $ANDROID_NDK_HOME"
            $ANDROID_NDK_HOME/ndk-build APP_ABI="armeabi-v7a" -j8 || echo "Falha ao compilar com ndk-build"
            mkdir -p ../../../build/native-libs
            find ../libs -type f -name "*.so"
            if [ -d "../libs/armeabi-v7a" ]; then
              mv ../libs/armeabi-v7a/* ../../../build/native-libs/
            fi
          fi
        
      - name: Upload native library as artifact
        uses: actions/upload-artifact@v4
        with:
          name: lib-armeabi-v7a
          path: app/build/native-libs/
      
      - name: Ensure library file exists
        run: |
          if [ ! -f "app/build/native-libs/lib.so" ]; then
            echo "Erro: Nenhum arquivo lib.so encontrado!" && exit 1
          fi
          ls -la app/build/native-libs/
      
      - name: Create Release
        id: create_release
        uses: actions/create-release@v1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          tag_name: release-${{ github.run_number }}
          release_name: Release ${{ github.run_number }}
          body: |
            Automatic build from push commit: ${{ github.sha }}
            
            This release contains the compiled library for:
            - armeabi-v7a
          draft: false
          prerelease: false
      
      - name: Upload Release Asset
        uses: actions/upload-release-asset@v1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          upload_url: ${{ steps.create_release.outputs.upload_url }}
          asset_path: app/build/native-libs/lib.so
          asset_name: lib-armeabi-v7a.so
          asset_content_type: application/octet-stream
      
      - name: Create latest tag
        run: |
          git config --global user.name "GitHub Actions"
          git config --global user.email "actions@github.com"
          git push --delete origin latest || true
          git tag -f latest
          git push -f origin latest
