name: CI
on:
  workflow_dispatch:
  push:
    tags:
      - "v*"
  pull_request:

jobs:
  Build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup JDK
        uses: actions/setup-java@v4
        with:
          java-version: 17
          distribution: temurin

      # Instalar Gradle diretamente em vez de usar o wrapper
      - name: Install Gradle
        run: |
          sudo apt-get update
          sudo apt-get install -y gradle
          gradle --version

      # Compilar usando o Gradle instalado no sistema
      - name: Build Native Libraries
        run: |
          gradle :app:externalNativeBuildDebug --no-daemon

      - name: Collect Native Libraries
        run: |
          mkdir -p native-libs
          find app/build -name "*.so" -type f -exec cp {} native-libs/ \;
          # Lista os arquivos para debug
          echo "Arquivos encontrados:"
          ls -la native-libs/

      - name: Create Release
        id: create_release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v1
        with:
          files: native-libs/*.so
          name: Release ${{ github.ref_name }}
          draft: false
          prerelease: false
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Upload Artifact (for non-release builds)
        if: "!startsWith(github.ref, 'refs/tags/')"
        uses: actions/upload-artifact@v4
        with:
          name: native-libs
          path: native-libs/*.so
