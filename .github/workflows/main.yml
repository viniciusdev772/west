name: Build Android Native Library
on:
  workflow_dispatch:
  push:
  pull_request:

jobs:
  build:
    name: Build Android App with Native Library
    runs-on: ubuntu-latest
    permissions:
      contents: write  
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'
          cache: gradle

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3
      
      - name: Install Android SDK components
        run: |
          echo "y" | sdkmanager "platforms;android-34"
          echo "y" | sdkmanager "platforms;android-29"
          echo "y" | sdkmanager "platforms;android-21"
          echo "y" | sdkmanager "build-tools;34.0.0"
          echo "y" | sdkmanager "ndk;25.2.9519653"
          echo "ANDROID_NDK_HOME=$ANDROID_SDK_ROOT/ndk/25.2.9519653" >> $GITHUB_ENV
      
      - name: Setup Gradle wrapper
        run: |
          if [ ! -f "gradle/wrapper/gradle-wrapper.jar" ]; then
            echo "Gradle wrapper not found, setting up..."
            gradle wrapper --gradle-version=8.6
          fi
          chmod +x ./gradlew
      
      - name: Create local.properties
        run: |
          echo "sdk.dir=$ANDROID_SDK_ROOT" > local.properties
          echo "ndk.dir=$ANDROID_NDK_HOME" >> local.properties
      
      - name: Build Android project with native library
        run: ./gradlew :app:assembleDebug --stacktrace
      
      - name: Find and copy native libraries
        run: |
          echo "Searching for compiled native libraries..."
          find . -name "*.so" -type f | head -10
          
          # Create output directory
          mkdir -p artifacts/native-libs
          
          # Copy native libraries if found
          if find app/build -name "*.so" -type f | grep -q .; then
            find app/build -name "*.so" -type f -exec cp {} artifacts/native-libs/ \;
            echo "Native libraries copied to artifacts/native-libs/"
            ls -la artifacts/native-libs/
          else
            echo "No native libraries found in build output"
            exit 1
          fi
      
      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: android-native-libs
          path: artifacts/native-libs/
      
      - name: Create Release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v1
        with:
          files: artifacts/native-libs/*.so
          name: Release ${{ github.ref_name }}
          body: |
            Automatic build from tag: ${{ github.ref_name }}
            
            This release contains the compiled native libraries for armeabi-v7a architecture.
            Built using Android Gradle Plugin with NDK.
          draft: false
          prerelease: false