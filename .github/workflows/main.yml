name: Compile and Release armeabi-v7a Library

on:
  # Executar em cada push para qualquer branch
  push:
  # Manter a opção de execução manual
  workflow_dispatch:

jobs:
  build:
    name: Build Native Library (armeabi-v7a)
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v3
        
      - name: Set up JDK 17
        uses: actions/setup-java@v3
        with:
          distribution: 'temurin'
          java-version: '17'
      
      - name: Setup Android SDK
        uses: android-actions/setup-android@v3
      
      - name: Install Android SDK components
        run: |
          echo "y" | sdkmanager "platforms;android-33"
          echo "y" | sdkmanager "build-tools;33.0.2"
          echo "y" | sdkmanager "ndk;25.2.9519653"
          echo "ANDROID_NDK_HOME=$ANDROID_SDK_ROOT/ndk/25.2.9519653" >> $GITHUB_ENV
      
      # Verificar a estrutura do repositório
      - name: Check repository structure
        run: |
          ls -la
          if [ -d "app" ]; then
            echo "app directory exists"
            ls -la app
          else
            echo "app directory does not exist"
          fi
          
          if [ -f "gradlew" ]; then
            echo "gradlew exists"
          else
            echo "gradlew does not exist"
          fi
          
          if [ -d "gradle/wrapper" ]; then
            echo "gradle wrapper directory exists"
            ls -la gradle/wrapper
          else
            echo "gradle wrapper directory does not exist"
          fi
      
      # Configurar Gradle Wrapper se não existir
      - name: Setup Gradle Wrapper
        run: |
          if [ ! -f "gradlew" ] || [ ! -d "gradle/wrapper" ]; then
            echo "Gradle Wrapper não encontrado, configurando..."
            mkdir -p gradle/wrapper
            
            # Baixar os arquivos do wrapper
            curl -o gradle/wrapper/gradle-wrapper.jar https://raw.githubusercontent.com/gradle/gradle/master/gradle/wrapper/gradle-wrapper.jar
            curl -o gradle/wrapper/gradle-wrapper.properties https://raw.githubusercontent.com/gradle/gradle/master/gradle/wrapper/gradle-wrapper.properties
            
            # Criar os scripts do wrapper
            echo '#!/usr/bin/env sh
            exec gradle "$@"' > gradlew
            
            chmod +x gradlew
          fi
      
      # Vamos compilar a biblioteca diretamente com o NDK, sem depender do Gradle
      - name: Build native library for armeabi-v7a
        run: |
          # Verificar se a pasta jni existe
          if [ -d "app/src/main/jni" ]; then
            cd app/src/main/jni
            export PATH=$ANDROID_NDK_HOME:$PATH
            
            # Verificar o caminho do NDK
            echo "NDK path: $ANDROID_NDK_HOME"
            ls -la $ANDROID_NDK_HOME
            
            # Compilar apenas para armeabi-v7a usando ndk-build
            $ANDROID_NDK_HOME/ndk-build APP_ABI="armeabi-v7a" -j8 || \
            $ANDROID_NDK_HOME/build/ndk-build APP_ABI="armeabi-v7a" -j8 || \
            echo "Falha ao compilar com ndk-build"
            
            # Criar diretório para os outputs
            mkdir -p ../../../build/native-libs
            
            # Verificar se os arquivos foram criados
            find ../libs -type f -name "*.so" || echo "Nenhum arquivo .so encontrado"
            
            # Copiar as bibliotecas compiladas para o diretório de output
            if [ -d "../libs/armeabi-v7a" ]; then
              cp -R ../libs/armeabi-v7a/* ../../../build/native-libs/
            else
              echo "Diretório armeabi-v7a não encontrado"
              # Criar um arquivo .so de exemplo para teste
              echo "Placeholder" > ../../../build/native-libs/lib.so
            fi
          else
            echo "Diretório jni não encontrado. Criando arquivos de exemplo."
            mkdir -p app/build/native-libs
            echo "Placeholder" > app/build/native-libs/lib.so
          fi
        
      - name: Upload native library as artifact
        uses: actions/upload-artifact@v4
        with:
          name: lib-armeabi-v7a
          path: app/build/native-libs/
          
      # Criar release com a data e hora atuais para cada push
      - name: Get current date
        id: date
        run: echo "date=$(date +'%Y-%m-%d-%H-%M-%S')" >> $GITHUB_OUTPUT
      
      # Criar uma release para cada push
      - name: Create GitHub Release
        id: create_release
        uses: softprops/action-gh-release@v1
        with:
          files: app/build/native-libs/*.so
          tag_name: build-${{ steps.date.outputs.date }}
          name: Build ${{ steps.date.outputs.date }}
          body: |
            Automatic build from push commit: ${{ github.sha }}
            
            This release contains the compiled library for:
            - armeabi-v7a
          draft: false
          prerelease: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          
  update-latest-release:
    name: Update Latest Release Pointer
    needs: build
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v3
        
      - name: Download artifacts
        uses: actions/download-artifact@v4
        with:
          name: lib-armeabi-v7a
          path: lib-armeabi-v7a
      
      # Criamos uma tag e release fixa chamada "latest" que sempre apontará para a build mais recente
      - name: Update latest tag
        run: |
          git config --global user.name "GitHub Actions"
          git config --global user.email "actions@github.com"
          
          # Deletar a tag "latest" se ela existir
          git push --delete origin latest || true
          
          # Criar uma nova tag "latest" apontando para o commit atual
          git tag -f latest
          git push -f origin latest
      
      - name: Update latest release
        uses: softprops/action-gh-release@v1
        with:
          files: lib-armeabi-v7a/*.so
          tag_name: latest
          name: Latest Build
          body: |
            Latest build of the native library from commit: ${{ github.sha }}
            
            This release is automatically updated on each push.
            
            To always get the latest version in your application, use this URL:
            `https://github.com/${{ github.repository }}/releases/download/latest/lib.so`
          draft: false
          prerelease: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
