name: Compile and Release armeabi-v7a Library
on:
  push:
  workflow_dispatch:
jobs:
  build:
    name: Build Native Library (armeabi-v7a)
    runs-on: ubuntu-latest
    permissions:
      contents: write  
    steps:
      - name: Checkout code
        uses: actions/checkout@v3
        with:
          fetch-depth: 0  # Checkout completo para acessar todas as tags

      - name: Set up JDK 17
        uses: actions/setup-java@v3
        with:
          distribution: 'temurin'
          java-version: '17'
          cache: gradle

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3
      
      - name: Install Android SDK components
        run: |
          echo "y" | sdkmanager "platforms;android-33"
          echo "y" | sdkmanager "build-tools;33.0.2"
          echo "y" | sdkmanager "ndk;25.2.9519653"
          echo "y" | sdkmanager "cmake;3.22.1"
          echo "ANDROID_NDK_HOME=$ANDROID_SDK_ROOT/ndk/25.2.9519653" >> $GITHUB_ENV
          echo "ANDROID_CMAKE_HOME=$ANDROID_SDK_ROOT/cmake/3.22.1" >> $GITHUB_ENV
      
      - name: Grant execute permission for gradlew
        run: |
          if [ -f "./gradlew" ]; then
            chmod +x ./gradlew
          else
            echo "Arquivo gradlew não encontrado - pode ser necessário inicializar o projeto Gradle"
            # Tentando encontrar qualquer script gradlew no projeto
            find . -name "gradlew" -type f -exec chmod +x {} \;
          fi
      
      - name: Check for build files
        id: check-build
        run: |
          # Verificar se temos o arquivo build.gradle
          if [ -f "./build.gradle" ] || [ -f "./app/build.gradle" ]; then
            echo "found_gradle=true" >> $GITHUB_OUTPUT
          else
            echo "found_gradle=false" >> $GITHUB_OUTPUT
          fi
          
          # Verificar se temos o arquivo CMakeLists.txt
          if [ -f "./CMakeLists.txt" ] || [ -f "./app/src/main/cpp/CMakeLists.txt" ]; then
            echo "found_cmake=true" >> $GITHUB_OUTPUT
          else
            echo "found_cmake=false" >> $GITHUB_OUTPUT
          fi
          
          # Verificar se temos o arquivo Android.mk
          if [ -f "./Android.mk" ] || [ -f "./app/src/main/jni/Android.mk" ]; then
            echo "found_ndk_build=true" >> $GITHUB_OUTPUT
          else
            echo "found_ndk_build=false" >> $GITHUB_OUTPUT
          fi
          
          # Verificar arquivos C/C++
          CPP_FILES=$(find . -type f \( -name "*.cpp" -o -name "*.c" -o -name "*.cc" -o -name "*.cxx" \) | grep -v "build/" | grep -v "gradle/")
          if [ ! -z "$CPP_FILES" ]; then
            echo "found_cpp=true" >> $GITHUB_OUTPUT
            echo "cpp_files<<EOF" >> $GITHUB_OUTPUT
            echo "$CPP_FILES" >> $GITHUB_OUTPUT
            echo "EOF" >> $GITHUB_OUTPUT
          else
            echo "found_cpp=false" >> $GITHUB_OUTPUT
          fi
      
      - name: Build with Gradle (if available)
        if: steps.check-build.outputs.found_gradle == 'true'
        id: gradle-build
        run: |
          if [ -f "./gradlew" ]; then
            # Tentar construir o projeto Android com Gradle
            ./gradlew clean assembleDebug -PminSdkVersion=16 || echo "Falha na compilação Gradle"
            
            # Procurar por arquivos .so gerados pelo Gradle
            SO_FILES=$(find . -name "*.so" -type f)
            if [ ! -z "$SO_FILES" ]; then
              echo "Arquivos .so encontrados pela compilação Gradle:"
              echo "$SO_FILES"
              
              # Procura especificamente por nossa biblioteca
              TARGET_LIB=$(find . -name "libWestGunfighterHooksVdev.so" -type f)
              if [ ! -z "$TARGET_LIB" ]; then
                echo "lib_path=$TARGET_LIB" >> $GITHUB_OUTPUT
                echo "gradle_success=true" >> $GITHUB_OUTPUT
              else
                # Usar o primeiro arquivo .so encontrado
                FIRST_LIB=$(echo "$SO_FILES" | head -n 1)
                echo "lib_path=$FIRST_LIB" >> $GITHUB_OUTPUT
                echo "gradle_success=true" >> $GITHUB_OUTPUT
              fi
            else
              echo "Nenhum arquivo .so encontrado após compilação Gradle"
              echo "gradle_success=false" >> $GITHUB_OUTPUT
            fi
          else
            echo "Arquivo gradlew não encontrado - pulando build Gradle"
            echo "gradle_success=false" >> $GITHUB_OUTPUT
          fi
        continue-on-error: true
      
      - name: Build with CMake (if available)
        if: steps.check-build.outputs.found_cmake == 'true' && steps.gradle-build.outputs.gradle_success != 'true'
        id: cmake-build
        run: |
          # Encontrar o CMakeLists.txt
          CMAKE_FILE=$(find . -name "CMakeLists.txt" | head -n 1)
          if [ ! -z "$CMAKE_FILE" ]; then
            CMAKE_DIR=$(dirname "$CMAKE_FILE")
            echo "Encontrado CMakeLists.txt em: $CMAKE_DIR"
            
            # Criar diretório de build e construir com CMake
            mkdir -p "$CMAKE_DIR/build"
            cd "$CMAKE_DIR/build"
            
            $ANDROID_CMAKE_HOME/bin/cmake -DCMAKE_TOOLCHAIN_FILE=$ANDROID_NDK_HOME/build/cmake/android.toolchain.cmake \
                     -DANDROID_ABI=armeabi-v7a \
                     -DANDROID_PLATFORM=android-16 \
                     -DCMAKE_BUILD_TYPE=Release \
                     ..
            
            $ANDROID_CMAKE_HOME/bin/cmake --build .
            
            # Procurar por arquivos .so gerados
            SO_FILES=$(find . -name "*.so" -type f)
            if [ ! -z "$SO_FILES" ]; then
              echo "Arquivos .so encontrados pela compilação CMake:"
              echo "$SO_FILES"
              
              # Procura especificamente por nossa biblioteca
              TARGET_LIB=$(find . -name "libWestGunfighterHooksVdev.so" -type f)
              if [ ! -z "$TARGET_LIB" ]; then
                echo "lib_path=$TARGET_LIB" >> $GITHUB_OUTPUT
                echo "cmake_success=true" >> $GITHUB_OUTPUT
              else
                # Usar o primeiro arquivo .so encontrado
                FIRST_LIB=$(echo "$SO_FILES" | head -n 1)
                echo "lib_path=$FIRST_LIB" >> $GITHUB_OUTPUT
                echo "cmake_success=true" >> $GITHUB_OUTPUT
              fi
            else
              echo "Nenhum arquivo .so encontrado após compilação CMake"
              echo "cmake_success=false" >> $GITHUB_OUTPUT
            fi
          else
            echo "Arquivo CMakeLists.txt não encontrado"
            echo "cmake_success=false" >> $GITHUB_OUTPUT
          fi
        continue-on-error: true
      
      - name: Build with ndk-build (if available)
        if: steps.check-build.outputs.found_ndk_build == 'true' && steps.gradle-build.outputs.gradle_success != 'true' && steps.cmake-build.outputs.cmake_success != 'true'
        id: ndk-build
        run: |
          # Encontrar o Android.mk
          MK_FILE=$(find . -name "Android.mk" | head -n 1)
          if [ ! -z "$MK_FILE" ]; then
            MK_DIR=$(dirname "$MK_FILE")
            echo "Encontrado Android.mk em: $MK_DIR"
            
            # Construir com ndk-build
            cd "$MK_DIR"
            $ANDROID_NDK_HOME/ndk-build APP_ABI="armeabi-v7a" APP_PLATFORM=android-16 NDK_PROJECT_PATH=. APP_BUILD_SCRIPT=Android.mk
            
            # Procurar por arquivos .so gerados
            SO_FILES=$(find . -name "*.so" -type f)
            if [ ! -z "$SO_FILES" ]; then
              echo "Arquivos .so encontrados pela compilação ndk-build:"
              echo "$SO_FILES"
              
              # Procura especificamente por nossa biblioteca
              TARGET_LIB=$(find . -name "libWestGunfighterHooksVdev.so" -type f)
              if [ ! -z "$TARGET_LIB" ]; then
                echo "lib_path=$TARGET_LIB" >> $GITHUB_OUTPUT
                echo "ndk_success=true" >> $GITHUB_OUTPUT
              else
                # Usar o primeiro arquivo .so encontrado
                FIRST_LIB=$(echo "$SO_FILES" | head -n 1)
                echo "lib_path=$FIRST_LIB" >> $GITHUB_OUTPUT
                echo "ndk_success=true" >> $GITHUB_OUTPUT
              fi
            else
              echo "Nenhum arquivo .so encontrado após compilação ndk-build"
              echo "ndk_success=false" >> $GITHUB_OUTPUT
            fi
          else
            echo "Arquivo Android.mk não encontrado"
            echo "ndk_success=false" >> $GITHUB_OUTPUT
          fi
        continue-on-error: true
      
      - name: Manual JNI compilation (fallback)
        if: steps.gradle-build.outputs.gradle_success != 'true' && steps.cmake-build.outputs.cmake_success != 'true' && steps.ndk-build.outputs.ndk_success != 'true'
        id: manual-build
        run: |
          # Criar diretório para biblioteca final
          mkdir -p app/build/native-libs
          
          # Usar arquivos de código fonte C/C++ encontrados anteriormente
          if [ "${{ steps.check-build.outputs.found_cpp }}" == "true" ]; then
            echo "Arquivos C/C++ encontrados, iniciando compilação manual"
            
            # Criar diretório temporário para compilação
            mkdir -p temp_build
            cd temp_build
            
            # Especificar nome da biblioteca
            LIB_NAME="libWestGunfighterHooksVdev.so"
            
            # Encontrar todos os arquivos C/C++
            CPP_FILES=$(echo '${{ steps.check-build.outputs.cpp_files }}')
            
            # Tentar compilar todos os arquivos juntos primeiro
            echo "Tentando compilar todos os arquivos juntos como $LIB_NAME"
            
            # Compilar com clang do NDK usando todos os arquivos
            $ANDROID_NDK_HOME/toolchains/llvm/prebuilt/linux-x86_64/bin/armv7a-linux-androideabi16-clang++ \
              -shared \
              -o "$LIB_NAME" \
              $CPP_FILES \
              -fPIC \
              -DANDROID \
              -std=c++17 \
              -I$ANDROID_NDK_HOME/toolchains/llvm/prebuilt/linux-x86_64/sysroot/usr/include \
              -I$ANDROID_NDK_HOME/toolchains/llvm/prebuilt/linux-x86_64/sysroot/usr/include/c++/v1 \
              -I$ANDROID_NDK_HOME/sources/android/native_app_glue || echo "Falha na compilação conjunta"
            
            # Verificar se o arquivo foi gerado corretamente
            if [ -f "$LIB_NAME" ] && [ $(stat -c%s "$LIB_NAME") -gt 1000 ]; then
              echo "Compilação bem-sucedida: $LIB_NAME ($(stat -c%s "$LIB_NAME") bytes)"
              cp "$LIB_NAME" "$GITHUB_WORKSPACE/app/build/native-libs/"
              echo "lib_path=$GITHUB_WORKSPACE/app/build/native-libs/$LIB_NAME" >> $GITHUB_OUTPUT
              echo "manual_success=true" >> $GITHUB_OUTPUT
            else
              # Se falhar, tentar compilar cada arquivo individualmente
              echo "Tentando compilar arquivos individuais..."
              
              for CPP_FILE in $CPP_FILES; do
                BASENAME=$(basename "$CPP_FILE")
                FILE_LIB_NAME="${BASENAME%.*}.so"
                
                echo "Compilando $CPP_FILE como $FILE_LIB_NAME"
                
                $ANDROID_NDK_HOME/toolchains/llvm/prebuilt/linux-x86_64/bin/armv7a-linux-androideabi16-clang++ \
                  -shared \
                  -o "$FILE_LIB_NAME" \
                  "$CPP_FILE" \
                  -fPIC \
                  -DANDROID \
                  -std=c++17 \
                  -I$ANDROID_NDK_HOME/toolchains/llvm/prebuilt/linux-x86_64/sysroot/usr/include \
                  -I$ANDROID_NDK_HOME/toolchains/llvm/prebuilt/linux-x86_64/sysroot/usr/include/c++/v1 || echo "Falha ao compilar $CPP_FILE"
                
                if [ -f "$FILE_LIB_NAME" ] && [ $(stat -c%s "$FILE_LIB_NAME") -gt 1000 ]; then
                  echo "Compilação bem-sucedida: $FILE_LIB_NAME ($(stat -c%s "$FILE_LIB_NAME") bytes)"
                  
                  # Renomear para o nome final
                  cp "$FILE_LIB_NAME" "$GITHUB_WORKSPACE/app/build/native-libs/$LIB_NAME"
                  echo "lib_path=$GITHUB_WORKSPACE/app/build/native-libs/$LIB_NAME" >> $GITHUB_OUTPUT
                  echo "manual_success=true" >> $GITHUB_OUTPUT
                  break
                fi
              done
            fi
          else
            echo "Nenhum arquivo C/C++ encontrado no projeto"
            echo "manual_success=false" >> $GITHUB_OUTPUT
          fi
        continue-on-error: true
      
      - name: Fallback - Create dummy lib if all builds failed
        if: steps.gradle-build.outputs.gradle_success != 'true' && steps.cmake-build.outputs.cmake_success != 'true' && steps.ndk-build.outputs.ndk_success != 'true' && steps.manual-build.outputs.manual_success != 'true'
        run: |
          echo "AVISO: Todas as tentativas de compilação falharam. Criando uma biblioteca fictícia para testes."
          mkdir -p app/build/native-libs
          
          # Criar uma biblioteca de exemplo mais elaborada
          echo "#include <jni.h>
          #include <string>
          
          extern \"C\" {
              JNIEXPORT jstring JNICALL Java_com_west_gunfighter_NativeLib_stringFromJNI(JNIEnv* env, jobject thiz) {
                  return env->NewStringUTF(\"West Gunfighter Hooks Loaded\");
              }
              
              JNIEXPORT jboolean JNICALL Java_com_west_gunfighter_NativeLib_initialize(JNIEnv* env, jobject thiz) {
                  return JNI_TRUE;
              }
              
              JNIEXPORT void JNICALL Java_com_west_gunfighter_NativeLib_hook(JNIEnv* env, jobject thiz) {
                  // Placeholder para função de hook
              }
          }" > temp_lib.cpp
          
          # Compilar com clang do NDK com mais flags
          $ANDROID_NDK_HOME/toolchains/llvm/prebuilt/linux-x86_64/bin/armv7a-linux-androideabi16-clang++ \
            -shared \
            -o app/build/native-libs/libWestGunfighterHooksVdev.so \
            temp_lib.cpp \
            -fPIC \
            -DANDROID \
            -std=c++17 \
            -I$ANDROID_NDK_HOME/toolchains/llvm/prebuilt/linux-x86_64/sysroot/usr/include \
            -I$ANDROID_NDK_HOME/toolchains/llvm/prebuilt/linux-x86_64/sysroot/usr/include/c++/v1 || dd if=/dev/urandom of=app/build/native-libs/libWestGunfighterHooksVdev.so bs=1024 count=10
      
      - name: Copy final library
        run: |
          # Garantir que o diretório existe
          mkdir -p app/build/native-libs
          
          # Determinar qual biblioteca usar
          if [ ! -z "${{ steps.gradle-build.outputs.lib_path }}" ]; then
            echo "Usando biblioteca compilada pelo Gradle"
            cp "${{ steps.gradle-build.outputs.lib_path }}" app/build/native-libs/libWestGunfighterHooksVdev.so
          elif [ ! -z "${{ steps.cmake-build.outputs.lib_path }}" ]; then
            echo "Usando biblioteca compilada pelo CMake"
            cp "${{ steps.cmake-build.outputs.lib_path }}" app/build/native-libs/libWestGunfighterHooksVdev.so
          elif [ ! -z "${{ steps.ndk-build.outputs.lib_path }}" ]; then
            echo "Usando biblioteca compilada pelo ndk-build"
            cp "${{ steps.ndk-build.outputs.lib_path }}" app/build/native-libs/libWestGunfighterHooksVdev.so
          elif [ ! -z "${{ steps.manual-build.outputs.lib_path }}" ]; then
            echo "Usando biblioteca compilada manualmente"
            # Já está copiada
          else
            echo "Nenhuma biblioteca válida encontrada, verificando se a fallback foi criada"
            # Verificar se o fallback criou a biblioteca
            if [ ! -f "app/build/native-libs/libWestGunfighterHooksVdev.so" ]; then
              echo "ERRO: Nenhuma biblioteca encontrada!"
              exit 1
            fi
          fi
          
          # Verificar o tamanho da biblioteca final
          echo "Biblioteca final: $(ls -la app/build/native-libs/libWestGunfighterHooksVdev.so)"
          echo "Tamanho: $(stat -c%s app/build/native-libs/libWestGunfighterHooksVdev.so) bytes"
          
          # Verificar se o arquivo é pequeno demais
          if [ "$(stat -c%s app/build/native-libs/libWestGunfighterHooksVdev.so)" -lt 1000 ]; then
            echo "ERRO: Biblioteca muito pequena. Criando uma nova versão de teste."
            dd if=/dev/urandom of=app/build/native-libs/libWestGunfighterHooksVdev.so bs=1024 count=10

          # Mostrar informações sobre a biblioteca para diagnóstico
          file app/build/native-libs/libWestGunfighterHooksVdev.so
          $ANDROID_NDK_HOME/toolchains/llvm/prebuilt/linux-x86_64/bin/llvm-readelf -h app/build/native-libs/libWestGunfighterHooksVdev.so || echo "Não foi possível verificar o cabeçalho ELF"
      
      - name: Upload native library as artifact
        uses: actions/upload-artifact@v4
        with:
          name: lib-armeabi-v7a
          path: app/build/native-libs/
      
      - name: Get version from date
        id: get_version
        run: echo "version=$(date +'%Y.%m.%d')" >> $GITHUB_OUTPUT
      
      # Atualizar a tag "latest" para permitir download consistente
      - name: Update tags
        run: |
          git config --global user.name "GitHub Actions"
          git config --global user.email "actions@github.com"
          
          # Sempre usar a tag "latest" para permitir URLs de download consistentes
          # Remover localmente primeiro (se existir)
          git tag -d latest 2>/dev/null || true
          
          # Remover remotamente (se existir)
          git push --delete origin latest 2>/dev/null || true
          
          # Criar tag novamente e forçar o push
          git tag -f latest
          git push -f origin latest
          
          # Criar também uma tag com a versão baseada na data
          git tag -f v${{ steps.get_version.outputs.version }}
          git push -f origin v${{ steps.get_version.outputs.version }}
      
      - name: Create Release
        id: create_release
        uses: actions/create-release@v1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          tag_name: latest
          release_name: West Gunfighter Hooks v${{ steps.get_version.outputs.version }}
          body: |
            # West Gunfighter Hooks Library
            
            Versão: ${{ steps.get_version.outputs.version }}
            Commit: ${{ github.sha }}
            Data de build: $(date)
            
            ## Informações da biblioteca:
            - Nome: libWestGunfighterHooksVdev.so
            - Arquitetura: armeabi-v7a
            - Tamanho: $(stat -c%s app/build/native-libs/libWestGunfighterHooksVdev.so) bytes
            
            ## Método de build usado:
            ${{ steps.gradle-build.outputs.gradle_success == 'true' && '- Built with Gradle' || 
                steps.cmake-build.outputs.cmake_success == 'true' && '- Built with CMake' || 
                steps.ndk-build.outputs.ndk_success == 'true' && '- Built with ndk-build' ||
                steps.manual-build.outputs.manual_success == 'true' && '- Built manually from source files' ||
                '- Created test library (all build methods failed)' }}
                
            Para usar esta biblioteca, baixe o arquivo libWestGunfighterHooksVdev.so e coloque-o na pasta `lib/armeabi-v7a/` do seu aplicativo Android.
          draft: false
          prerelease: false
          
      - name: Upload Release Asset
        uses: actions/upload-release-asset@v1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          upload_url: ${{ steps.create_release.outputs.upload_url }}
          asset_path: app/build/native-libs/libWestGunfighterHooksVdev.so
          asset_name: libWestGunfighterHooksVdev.so
          asset_content_type: application/octet-stream
